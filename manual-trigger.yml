name: Manual Update

on:
  repository_dispatch:
    types: [manual-update]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      
      - name: Install dependencies
        run: |
          install.packages(c("tidyverse", "googlesheets4", "httr"))
        shell: Rscript {0}
      
      - name: Run R script
        run: Rscript update_baseball_sheet.R
