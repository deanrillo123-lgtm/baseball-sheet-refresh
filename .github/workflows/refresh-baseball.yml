name: Refresh baseball sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::baseballr
            any::dplyr
            any::googlesheets4
            any::httr
            any::jsonlite
            any::lubridate
            any::purrr
            any::readr
            any::tibble
            any::rvest
            any::xml2
            any::stringr
            any::janitor

      - name: Write Google auth JSON
        run: |
          cat <<'EOF' > gs4-auth.json
          ${{ secrets.GS4_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run update script
        run: Rscript update_baseball_sheet.R
