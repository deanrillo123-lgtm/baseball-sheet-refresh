name: Refresh baseball sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4.2.0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2.8.0

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::baseballr
            any::dplyr
            any::googlesheets4
            any::lubridate
            any::purrr
            any::readr
            any::tibble
            any::rvest
            any::xml2
            any::stringr
            any::janitor
            any::tidyr

      - name: Write Google auth JSON
        run: |
          cat <<'EOF' > gs4-auth.json
          ${{ secrets.GS4_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run update script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: Rscript update_baseball_sheet.R
