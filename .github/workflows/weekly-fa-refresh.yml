name: Weekly Free Agent Helper Refresh

on:
  workflow_dispatch:
  schedule:
    # Sunday 2 AM Chicago time during baseball season (CDT, Apr-Oct) = Sunday 7 AM UTC.
    # During off-season (CST, Nov-Mar) this runs at 1 AM Chicago; update to
    # "0 8 * * 0" if year-round 2 AM Chicago consistency is required.
    - cron: "0 7 * * 0"

jobs:
  fa-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::baseballr
            any::dplyr
            any::googlesheets4
            any::lubridate
            any::purrr
            any::readr
            any::tibble
            any::stringr

      - name: Write Google auth JSON
        run: |
          cat <<'EOF' > gs4-auth.json
          ${{ secrets.GS4_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run Free Agent Helper update script
        run: Rscript update_fa_helper.R
